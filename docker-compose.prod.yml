# Production overlay: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Secrets have no defaults here. The stack refuses to start until .env provides them.
x-required-env: &required-env
  APP_ENV: production
  APP_BASE_URL: https://${DOMAIN:?set DOMAIN}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:-medicompare-prescriptions}
  COOKIE_SECURE: "true"
  CLAMAV_ADDRESS: clamav:3310
  OCR_ENGINE: ${OCR_ENGINE:-tesseract}
  RETENTION_DAYS: ${RETENTION_DAYS:-7}

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./scripts/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      frontend: {condition: service_healthy}
    deploy: {resources: {limits: {cpus: "0.5", memory: 128m}}}
  postgres:
    restart: unless-stopped
    ports: !reset []
    deploy: {resources: {limits: {cpus: "1", memory: 1g}}}
  redis:
    restart: unless-stopped
    ports: !reset []
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    deploy: {resources: {limits: {cpus: "0.25", memory: 192m}}}
  minio:
    restart: unless-stopped
    ports: !reset []
    deploy: {resources: {limits: {cpus: "0.5", memory: 512m}}}
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy: {resources: {limits: {cpus: "0.5", memory: 1500m}}}
  migrate:
    environment: *required-env
    # Production does not load demo data: real data arrives through the admin import.
    command: ["sh", "-c", "alembic upgrade head"]
  backend:
    restart: unless-stopped
    environment: *required-env
    ports: !reset []
    deploy: {resources: {limits: {cpus: "1", memory: 768m}}}
  worker:
    restart: unless-stopped
    environment: *required-env
    deploy: {resources: {limits: {cpus: "1.5", memory: 1500m}}}
  scheduler:
    restart: unless-stopped
    environment: *required-env
    deploy: {resources: {limits: {cpus: "0.25", memory: 256m}}}
  frontend:
    restart: unless-stopped
    ports: !reset []
    deploy: {resources: {limits: {cpus: "0.75", memory: 512m}}}
volumes:
  caddydata:
