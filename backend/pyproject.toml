[project]
name = "medicompare-backend"
version = "1.0.0"
description = "MediCompare API, prescription pipeline and data importers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.9", "pydantic-settings>=2.6",
  "email-validator>=2.2", "sqlalchemy>=2.0.36", "alembic>=1.14", "psycopg[binary]>=3.2",
  "redis>=5.2", "rq>=2.0", "boto3>=1.35", "argon2-cffi>=23.1", "python-multipart>=0.0.20",
  "pillow>=11.0", "opencv-python-headless>=4.10", "numpy>=1.26,<3", "pypdf>=5.1", "pypdfium2>=4.30",
  "rapidfuzz>=3.10", "reportlab>=4.2", "httpx>=0.27", "pyyaml>=6.0", "jsonschema>=4.23",
  "pytesseract>=0.3.13", "rapidocr-onnxruntime>=1.4.4", "structlog>=24.4", "anthropic>=0.80",
]

[dependency-groups]
dev = [
  "pytest>=8.3", "pytest-cov>=6.0", "hypothesis>=2.0", "ruff>=0.8", "mypy>=1.13", "bandit>=1.8",
  "pip-audit>=2.7", "locust>=2.32", "types-pyyaml", "types-redis", "boto3-stubs[s3]", "pdfplumber>=0.11",
  "matplotlib>=3.9", "python-pptx>=1.0", "openapi-spec-validator>=0.7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = ["B008", "S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["app.safety.*", "app.matching.*", "app.pricing.*", "app.prescriptions.extraction", "app.prescriptions.confidence"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["safety: safety invariant suite", "ocr: needs a local OCR engine"]

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py"]

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
