# Dev profile. `make up` starts infrastructure plus the application containers.
name: medicompare
x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
  SECRET_KEY: ${SECRET_KEY:-dev-only-secret-not-for-production}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-medicompare}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-medicompare}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-devminioaccess}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-devminiosecret}
  S3_BUCKET: ${S3_BUCKET:-medicompare-prescriptions}
  OCR_ENGINE: ${OCR_ENGINE:-tesseract}
  RETENTION_DAYS: ${RETENTION_DAYS:-7}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  CLAMAV_ADDRESS: ${CLAMAV_ADDRESS:-}
  RATE_LIMIT_PUBLIC_PER_MINUTE: ${RATE_LIMIT_PUBLIC_PER_MINUTE:-300}
  RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-20}
  RATE_LIMIT_UPLOAD_PER_HOUR: ${RATE_LIMIT_UPLOAD_PER_HOUR:-30}
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medicompare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-medicompare}
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicompare"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-devminioaccess}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-devminiosecret}
    ports: ["127.0.0.1:9010:9000"]
    volumes: [miniodata:/data]
  migrate:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment: *backend-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed"]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_started}
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment: *backend-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
  worker:
    build: {context: ., dockerfile: worker/Dockerfile}
    environment: *backend-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  scheduler:
    build: {context: ., dockerfile: worker/Dockerfile}
    environment: *backend-env
    command: ["python", "-m", "worker.scheduler"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  frontend:
    build: {context: frontend, args: {BACKEND_ORIGIN: "http://backend:8000"}}
    environment:
      BACKEND_ORIGIN: http://backend:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/usr/bin/node", "-e", "fetch('http://localhost:3000/en').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
  # Runs backend tests and the OCR evaluation with Tesseract installed. `make test-backend`.
  backend-test:
    profiles: ["test"]
    build: {context: ., dockerfile: backend/Dockerfile.test}
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-medicompare}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/medicompare_test
      REDIS_URL: redis://redis:6379/1
      OCR_ENGINE: tesseract
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-devminioaccess}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-devminiosecret}
    volumes:
      - .:/srv/medicompare
      - /srv/medicompare/backend/.venv
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
volumes:
  pgdata:
  miniodata:
