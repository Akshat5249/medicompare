repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend lint
        language: system
        entry: bash -c 'cd frontend && npx eslint src e2e && npx prettier --check src e2e messages'
        files: ^frontend/
        pass_filenames: false
