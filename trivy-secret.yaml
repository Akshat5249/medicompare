# Secret scanning stays on. This allows one reviewed false positive, as narrowly as possible:
# docstrings in the Anthropic SDK contain {"type": "service_account"}, which Trivy's GCP rule
# flags. There is no key material in that package. Review this when the SDK is updated.
allow-rules:
  - id: anthropic-sdk-service-account-docstring
    description: Documentation text in the Anthropic SDK, not a credential
    path: .*/site-packages/anthropic/.*\.py
    regex: '"type":\s*"service_account"'
