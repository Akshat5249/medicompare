components:
  schemas:
    Body_stage_import_api_v1_admin_imports_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        source_code:
          type: string
          title: Source Code
        kind:
          type: string
          title: Kind
      type: object
      required:
      - file
      - source_code
      - kind
      title: Body_stage_import_api_v1_admin_imports_post
    Body_upload_api_v1_prescriptions_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        consent:
          type: boolean
          title: Consent
          default: false
      type: object
      required:
      - file
      title: Body_upload_api_v1_prescriptions_upload_post
    CloseIn:
      properties:
        note:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Note
      type: object
      title: CloseIn
    CorrectIn:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Name
        strength:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Strength
        form:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Form
        frequency:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Frequency
        duration:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Duration
      type: object
      title: CorrectIn
    EmergencyOut:
      properties:
        detected:
          type: boolean
          title: Detected
        number:
          type: string
          title: Number
        message:
          type: string
          title: Message
      type: object
      required:
      - detected
      - number
      - message
      title: EmergencyOut
    LinkIn:
      properties:
        label:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Label
        days:
          anyOf:
          - type: integer
            maximum: 30.0
            minimum: 1.0
          - type: 'null'
          title: Days
      type: object
      title: LinkIn
    ListIn:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
      type: object
      required:
      - name
      title: ListIn
    ListItemIn:
      properties:
        medicine_id:
          type: integer
          title: Medicine Id
      type: object
      required:
      - medicine_id
      title: ListItemIn
    LoginIn:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          maxLength: 200
          title: Password
      type: object
      required:
      - email
      - password
      title: LoginIn
    ManualIn:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ManualItemIn'
          type: array
          maxItems: 30
          minItems: 1
          title: Items
      type: object
      required:
      - items
      title: ManualIn
    ManualItemIn:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Name
        strength:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Strength
        form:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Form
        frequency:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Frequency
        duration:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Duration
      type: object
      title: ManualItemIn
    MedicineSummary:
      properties:
        id:
          type: integer
          title: Id
        display_name:
          type: string
          title: Display Name
        generic_name:
          type: string
          title: Generic Name
        brand:
          anyOf:
          - type: string
          - type: 'null'
          title: Brand
        dosage_form:
          type: string
          title: Dosage Form
        release_type:
          type: string
          title: Release Type
        route:
          type: string
          title: Route
        is_demo:
          type: boolean
          title: Is Demo
      type: object
      required:
      - id
      - display_name
      - generic_name
      - brand
      - dosage_form
      - release_type
      - route
      - is_demo
      title: MedicineSummary
    PharmacistDecision:
      properties:
        status:
          type: string
          pattern: ^(approved|rejected)$
          title: Status
      type: object
      required:
      - status
      title: PharmacistDecision
    PharmacistRegisterIn:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          maxLength: 200
          minLength: 10
          title: Password
        display_name:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Display Name
        registration_number:
          type: string
          maxLength: 64
          minLength: 3
          title: Registration Number
        state_council:
          type: string
          maxLength: 120
          minLength: 2
          title: State Council
      type: object
      required:
      - email
      - password
      - registration_number
      - state_council
      title: PharmacistRegisterIn
    RegisterIn:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          maxLength: 200
          minLength: 10
          title: Password
        display_name:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Display Name
      type: object
      required:
      - email
      - password
      title: RegisterIn
    ReviewDoneIn:
      properties:
        note:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Note
      type: object
      title: ReviewDoneIn
    RowCorrection:
      properties:
        raw:
          additionalProperties: true
          type: object
          title: Raw
      type: object
      required:
      - raw
      title: RowCorrection
    SafetyCheckIn:
      properties:
        text:
          type: string
          maxLength: 2000
          title: Text
      type: object
      required:
      - text
      title: SafetyCheckIn
    SearchResponse:
      properties:
        query:
          type: string
          title: Query
        emergency:
          $ref: '#/components/schemas/EmergencyOut'
        exact_matches:
          items:
            $ref: '#/components/schemas/SearchResult'
          type: array
          title: Exact Matches
        possible_matches:
          items:
            $ref: '#/components/schemas/SearchResult'
          type: array
          title: Possible Matches
      type: object
      required:
      - query
      - emergency
      - exact_matches
      - possible_matches
      title: SearchResponse
      example:
        emergency:
          detected: false
          message: '...'
          number: '112'
        exact_matches: []
        possible_matches:
        - match_type: possible
          medicine:
            display_name: Metformin 500mg Tablet
            dosage_form: Tablet
            generic_name: Metformin
            id: 1
            is_demo: false
            release_type: Conventional (no release modifier stated)
            route: Oral
          reason: Similar spelling to “metformin”. A similar name does not mean the
            same medicine.
        query: metformn
    SearchResult:
      properties:
        medicine:
          $ref: '#/components/schemas/MedicineSummary'
        match_type:
          type: string
          title: Match Type
        reason:
          type: string
          title: Reason
      type: object
      required:
      - medicine
      - match_type
      - reason
      title: SearchResult
    ShareIn:
      properties:
        pharmacist_id:
          type: string
          format: uuid
          title: Pharmacist Id
      type: object
      required:
      - pharmacist_id
      title: ShareIn
    VerifyIn:
      properties:
        medicine_id:
          type: integer
          title: Medicine Id
        lasa_acknowledged:
          type: boolean
          title: Lasa Acknowledged
          default: false
        note:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Note
      type: object
      required:
      - medicine_id
      title: VerifyIn
