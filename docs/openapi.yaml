openapi: 3.1.0
info:
  title: MediCompare API
  summary: Neutral, source-traceable medicine price information for India.
  description: Information only, not medical advice. MediCompare does not sell, prescribe
    or dispense medicines. State-changing requests require the session's X-CSRF-Token
    header. Errors use RFC 9457 problem details.
  version: 1.0.0
paths:
  /api/v1/health/live:
    get:
      tags:
      - health
      summary: Live
      operationId: live_api_v1_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Live Api V1 Health Live Get
        4XX:
          description: Problem details (RFC 9457)
          content:
            application/problem+json:
              example:
                type: https://medicompare.invalid/problems/not_found
                title: Medicine not found
                status: 404
                code: not_found
  /api/v1/health/ready:
    get:
      tags:
